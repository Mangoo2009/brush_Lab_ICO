<!DOCTYPE html>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">

<div class="container my-5">
  <!-- Обертка для всей строки с отступами между карточками gap-4 (или g-4) -->
  <div class="row g-4">

    <!-- Карточка 1 -->
    <!-- col-12 (на мобильных 1 в ряд), md:col-6 (на планшетах 2 в ряд), lg:col-4 (на ПК 3 в ряд) -->
    <div class="col-12 md:col-6 lg:col-4">
      <div class="card h-100">
        <img src="product1.jpg" class="card-img-top" alt="Товар">
        <div class="card-body">
          <h5 class="card-title">Название товара 1</h5>
          <p class="card-text">Описание товара...</p>
          <button class="btn-solid theme-primary">Купить</button>
        </div>
      </div>
    </div>

    <!-- Карточка 2 -->
    <div class="col-12 md:col-6 lg:col-4">
      <div class="card h-100">

          <h5 class="card-title">Название товара 2</h5>
          <p class="card-text">Описание товара...</p>
          <button class="btn-solid theme-primary">Купить</button>
        </div>
      </div>
    </div>

    <!-- Карточка 3 -->
    <div class="col-12 md:col-6 lg:col-4">
      <div class="card h-100">
        <img src="product3.jpg" class="card-img-top" alt="Товар">

  </div>
