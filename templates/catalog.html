<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Каталог</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
<nav class="navbar bg-1">
  <div class="container-fluid nav-inner">
    <a class="navbar-brand nav-brand" href="/">
      brush Lab ICO
    </a>
    <form class="nav-search" role="search">
      <div class="search-wrap">
        <input
          class="form-control"
          type="search"
          placeholder="Поиск товаров"
          aria-label="Поиск"
        >
        <button class="btn-solid" type="submit">S</button>
      </div>
    </form>
    <div class="nav-right">
      <a class="nav-cart" href="/cart">Корзина</a>

      <a href="/profile">
        <img
          class="avatar-img"
          src="https://github.com/mdo.png"
          alt="Профиль"
        >
      </a>
    </div>
  </div>
</nav>
<div class="catalog">
  {% for prod in products %}
  <article class="card">
    <img src="{{ url_for('static', path='img/' ~ prod.photo) }}" class="card-img" alt="{{ prod.name }}">
    <div class="card-body">
      <h4 class="card-title">{{ prod.name }}</h4>
      <p class="card-desc">{{ prod.description }}</p>
      <div class="card-footer">
        <span class="price">{{ prod.price }} P</span>
        <a href="#" class="btn">Купить</a>
      </div>
    </div>
  </article>
  {% endfor %}
</div>
<footer>
  <p>© 2026 . Все права щеток защищены</p>
  <h5>
    Контактная информация:<br>
    Телефон + 7(666)666-67-67<br>
    e-mail: byrmalda@main.py
  </h5>

</footer>
<script type="importmap">
{
  "imports": {
    "@floating-ui/dom": "https://cdn.jsdelivr.net/npm/@floating-ui/dom@1.7.6/dist/floating-ui.dom.esm.min.js",
    "vanilla-calendar-pro": "https://cdn.jsdelivr.net/npm/vanilla-calendar-pro@3.4.0/index.mjs"
  }
}
</script>
<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.min.js" integrity="sha384-BJf/nQgxZJU68GxBse97Vdlc8Rh+z9PzzXiS3/BjV+1nQPR7IKn+iJnD3DJvCMaU" crossorigin="anonymous"></script>
</body>
</html>
